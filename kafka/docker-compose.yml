# Arquitectura basada en eventos con Apache Kafka
#   docker compose up -d --build
#   docker compose up -d --scale inventory-consumer=2      (reparto de carga en un mismo grupo)
#   docker compose --profile late up -d audit-consumer     (consumidor posterior, lee el log desde el inicio)
services:
  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: kafka
    hostname: kafka
    ports:
      - "29092:29092"             # acceso externo desde la maquina anfitriona
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_NUM_PARTITIONS=3
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka-data:/bitnami/kafka   # el log de eventos sobrevive a reinicios del broker
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 12

  # Crea el topico orders.events con 3 particiones (necesario para repartir carga
  # entre varias instancias de un mismo consumer group) y termina.
  kafka-init:
    image: bitnamilegacy/kafka:3.7
    container_name: kafka-init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic orders.events --partitions 3 --replication-factor 1 &&
        kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic orders.events
    depends_on:
      kafka:
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  orders-api:
    build: ./orders-api
    container_name: orders-api-kafka
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=orders.events
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # Los consumidores no declaran container_name ni ports: se pueden escalar
  # y no exponen ningun endpoint HTTP.
  inventory-consumer:
    build: ./inventory-consumer
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=orders.events
      - KAFKA_GROUP_ID=inventory-service-group
      - PROCESSING_MS=1500
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  billing-consumer:
    build: ./billing-consumer
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=orders.events
      - KAFKA_GROUP_ID=billing-service-group
      - PROCESSING_MS=1000
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  notification-consumer:
    build: ./notification-consumer
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=orders.events
      - KAFKA_GROUP_ID=notification-service-group
      - PROCESSING_MS=800
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # Consumidor posterior: no arranca con "up"; se inicia despues de publicar eventos.
  audit-consumer:
    build: ./audit-consumer
    profiles: ["late"]
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=orders.events
      - KAFKA_GROUP_ID=audit-service-group
      - PROCESSING_MS=100
    depends_on:
      kafka-init:
        condition: service_completed_successfully

volumes:
  kafka-data:
